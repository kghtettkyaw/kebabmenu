<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>
    <style>
        /* အခြေခံ သတ်မှတ်ချက်များ */
        body {
            background-color: #000000; /* နောက်ခံအမည်းရောင် */
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        /* ပုံများကို ထည့်သွင်းမည့် Container */
        .menu-container {
            width: 100%;
            max-width: 800px; /* PC/Tablet များတွင် အကျယ်ကန့်သတ်ထားရန် */
            display: flex;
            flex-direction: column;
            gap: 20px; /* ပုံတစ်ပုံနှင့် တစ်ပုံကြား အကွာအဝေး (20px) */
        }

        /* ပုံများအတွက် Mobile Responsive ဖြစ်စေမည့် CSS */
        .menu-image {
            width: 100%;
            height: auto; /* မူရင်းအချိုးအစားမပျက်စေရန် */
            display: block;
            border: 2px solid #FFD700; /* ပုံစံတူ အဝါရောင်ဘောင်လေး ထည့်ထားပေးပါသည် */
            border-radius: 8px; /* ထောင့်လေးများ အနည်းငယ်ဝိုင်းစေရန် */
            box-shadow: 0 4px 8px rgba(255, 215, 0, 0.2); /* အဝါရောင် အရိပ်ဖျော့ဖျော့လေး */
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <img src="images/1.png" alt="Menu Page 1" class="menu-image">
        <img src="images/2.png" alt="Menu Page 2" class="menu-image">
        <img src="images/3.png" alt="Menu Page 3" class="menu-image">
        <img src="images/4.png" alt="Menu Page 4" class="menu-image">
        <img src="images/5.png" alt="Menu Page 5" class="menu-image">
    </div>

</body>
</html>
